<!DOCTYPE html>
<html>
<head>
    <title>Dynamic HTML Example</title>
</head>
<body>

    <p id="dynamic-text">The initial text is here.</p>
    <button onclick="changeText()">Click to Change the Text</button>

    <script>
        // JavaScript function to change the paragraph content
        function changeText() {
            // Get the element with the ID 'dynamic-text' and change its innerHTML property
            document.getElementById("dynamic-text").innerHTML = "The text has been dynamically changed!";
        }
    </script>

</body>
</html>
