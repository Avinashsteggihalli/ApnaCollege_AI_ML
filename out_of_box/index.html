<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Board — notes &amp; a chat about them</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --board: #1f3a34;
    --board-dark: #16302b;
    --board-light: #2a4a42;
    --chalk: #f1ede4;
    --chalk-dim: #b9c4bc;
    --chalk-yellow: #e8c468;
    --chalk-coral: #e0836f;
    --paper: #fbf8f0;
    --paper-line: #e3ddc9;
    --ink: #2c2a25;
    --shadow: rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    color:var(--chalk);
    background:
      repeating-linear-gradient(0deg, rgba(241,237,228,0.05) 0px, rgba(241,237,228,0.05) 1px, transparent 1px, transparent 34px),
      radial-gradient(ellipse at 20% 0%, var(--board-light) 0%, var(--board) 55%, var(--board-dark) 100%);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }
  /* chalk dust flecks */
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; opacity:0.5;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(241,237,228,0.15), transparent),
      radial-gradient(1px 1px at 80% 60%, rgba(241,237,228,0.12), transparent),
      radial-gradient(1px 1px at 40% 85%, rgba(241,237,228,0.10), transparent),
      radial-gradient(1px 1px at 65% 15%, rgba(241,237,228,0.12), transparent);
    background-size: 100% 100%;
  }

  header{
    padding:28px 40px 10px;
    position:relative;
    z-index:1;
  }
  header h1{
    font-family:'Caveat',cursive;
    font-weight:700;
    font-size:44px;
    margin:0;
    color:var(--chalk);
    letter-spacing:0.5px;
    text-shadow: 0 0 14px rgba(241,237,228,0.15);
  }
  header h1 span{ color: var(--chalk-yellow); }
  header p{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--chalk-dim);
    margin:4px 0 0;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }

  .app{
    flex:1;
    display:flex;
    gap:28px;
    padding:10px 40px 40px;
    position:relative;
    z-index:1;
    min-height:0;
  }

  /* ---------- Sidebar: pinned cards ---------- */
  .sidebar{
    width:270px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .new-note-btn{
    align-self:flex-start;
    display:flex;
    align-items:center;
    gap:8px;
    background:transparent;
    border:2px dashed var(--chalk-dim);
    color:var(--chalk);
    font-family:'Caveat',cursive;
    font-size:20px;
    font-weight:600;
    padding:8px 18px;
    border-radius:999px;
    cursor:pointer;
    transition: all .15s ease;
  }
  .new-note-btn:hover{ border-color: var(--chalk-yellow); color:var(--chalk-yellow); transform: translateY(-1px); }

  .note-list{
    display:flex;
    flex-direction:column;
    gap:18px;
    overflow-y:auto;
    padding:6px 6px 20px 2px;
  }
  .note-card{
    background:var(--paper);
    color:var(--ink);
    border-radius:3px;
    padding:14px 14px 12px;
    cursor:pointer;
    position:relative;
    box-shadow: 3px 6px 14px var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .note-card:nth-child(3n+1){ transform: rotate(-1.6deg); }
  .note-card:nth-child(3n+2){ transform: rotate(1.1deg); }
  .note-card:nth-child(3n){ transform: rotate(-0.4deg); }
  .note-card:hover{ box-shadow: 4px 10px 20px var(--shadow); z-index:2; }
  .note-card.active{ outline:2px solid var(--chalk-yellow); }
  .note-card .pin{
    position:absolute; top:-7px; left:16px;
    width:12px; height:12px; border-radius:50%;
    background: var(--chalk-coral);
    box-shadow: 0 2px 3px rgba(0,0,0,0.4);
  }
  .note-card h3{
    font-family:'Caveat',cursive;
    font-size:22px;
    margin:6px 0 4px;
    font-weight:700;
    line-height:1.1;
    word-break:break-word;
  }
  .note-card p{
    font-size:12px;
    line-height:1.4;
    margin:0 0 8px;
    color:#5b5647;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .note-card time{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:#8a8470;
  }
  .empty-hint{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--chalk-dim);
    border:1px dashed rgba(241,237,228,0.25);
    border-radius:8px;
    padding:16px;
    text-align:center;
  }

  /* ---------- Main paper ---------- */
  .page-wrap{
    flex:1;
    display:flex;
    justify-content:center;
    min-width:0;
  }
  .page{
    position:relative;
    width:100%;
    max-width:720px;
    background:var(--paper);
    border-radius:4px;
    box-shadow: 0 18px 40px var(--shadow);
    padding:38px 40px 28px;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .clip{
    position:absolute;
    top:-16px; left:50%; transform:translateX(-50%);
    width:64px; height:26px;
    background:linear-gradient(180deg,#c7cbc4,#8f948a);
    border-radius:6px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.4);
  }
  .clip::after{
    content:"";
    position:absolute; left:50%; top:50%;
    width:14px; height:14px;
    transform:translate(-50%,-50%);
    background:#5c6058;
    border-radius:50%;
  }
  .title-input{
    font-family:'Caveat',cursive;
    font-weight:700;
    font-size:34px;
    color:var(--ink);
    border:none;
    outline:none;
    background:transparent;
    width:100%;
    margin-bottom:6px;
  }
  .title-input::placeholder{ color:#b9b39c; }
  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:#8a8470;
    margin-bottom:14px;
    border-bottom:1px solid var(--paper-line);
    padding-bottom:10px;
  }
  .content-textarea{
    flex:1;
    resize:none;
    border:none;
    outline:none;
    background:
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 27px, var(--paper-line) 28px);
    font-family:'Inter',sans-serif;
    font-size:15px;
    line-height:28px;
    color:var(--ink);
    padding-top:0;
    min-height:340px;
  }
  .content-textarea::placeholder{ color:#c2bda6; }
  .actions-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid var(--paper-line);
  }
  .save-status{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:#8a8470;
  }
  .delete-btn{
    background:transparent;
    border:1px solid var(--chalk-coral);
    color:var(--chalk-coral);
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:600;
    padding:7px 14px;
    border-radius:6px;
    cursor:pointer;
  }
  .delete-btn:hover{ background:var(--chalk-coral); color:var(--paper); }

  .no-note{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#8a8470;
    font-family:'Caveat',cursive;
    font-size:24px;
    padding:60px 20px;
  }

  /* ---------- Chat bubble ---------- */
  .chat-toggle{
    position:fixed;
    bottom:28px; right:28px;
    width:60px; height:60px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--board-light), var(--board-dark));
    border:2px solid rgba(241,237,228,0.35);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow: 0 8px 22px rgba(0,0,0,0.5);
    z-index:50;
    transition: transform .15s ease;
  }
  .chat-toggle:hover{ transform: scale(1.06); border-color: var(--chalk-yellow); }
  .chat-toggle svg{ width:26px; height:26px; }

  .chat-panel{
    position:fixed;
    bottom:100px; right:28px;
    width:360px;
    max-width:calc(100vw - 40px);
    height:480px;
    max-height:calc(100vh - 150px);
    background: rgba(22,48,43,0.97);
    border:2px dashed rgba(241,237,228,0.4);
    border-radius:18px 18px 4px 18px;
    display:flex;
    flex-direction:column;
    z-index:50;
    box-shadow: 0 20px 50px rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    overflow:hidden;
  }
  .chat-header{
    padding:14px 18px 10px;
    border-bottom:1px dashed rgba(241,237,228,0.25);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .chat-header h2{
    font-family:'Caveat',cursive;
    font-size:22px;
    margin:0;
    color:var(--chalk-yellow);
  }
  .chat-header button{
    background:none; border:none; color:var(--chalk-dim);
    font-size:18px; cursor:pointer; line-height:1;
  }
  .chat-messages{
    flex:1;
    overflow-y:auto;
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .msg{
    max-width:85%;
    padding:9px 13px;
    border-radius:12px;
    font-size:13px;
    line-height:1.5;
    white-space:pre-wrap;
  }
  .msg.user{
    align-self:flex-end;
    background: var(--chalk-coral);
    color:#2a1712;
    border-bottom-right-radius:2px;
  }
  .msg.assistant{
    align-self:flex-start;
    background: rgba(241,237,228,0.1);
    color:var(--chalk);
    border:1px solid rgba(241,237,228,0.15);
    border-bottom-left-radius:2px;
  }
  .msg.system-note{
    align-self:center;
    color:var(--chalk-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    text-align:center;
  }
  .typing-dots span{
    display:inline-block; width:5px; height:5px; margin-right:3px;
    background:var(--chalk-dim); border-radius:50%;
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2){ animation-delay:0.15s; }
  .typing-dots span:nth-child(3){ animation-delay:0.3s; }
  @keyframes bounce{ 0%,60%,100%{ transform:translateY(0); opacity:0.5;} 30%{ transform:translateY(-4px); opacity:1;} }

  .chat-input-row{
    display:flex;
    gap:8px;
    padding:12px;
    border-top:1px dashed rgba(241,237,228,0.25);
  }
  .chat-input-row input{
    flex:1;
    background:rgba(241,237,228,0.08);
    border:1px solid rgba(241,237,228,0.2);
    border-radius:8px;
    padding:9px 12px;
    color:var(--chalk);
    font-family:'Inter',sans-serif;
    font-size:13px;
    outline:none;
  }
  .chat-input-row input::placeholder{ color:var(--chalk-dim); }
  .chat-input-row input:focus{ border-color:var(--chalk-yellow); }
  .chat-input-row button{
    background:var(--chalk-yellow);
    border:none;
    border-radius:8px;
    padding:0 16px;
    font-weight:700;
    cursor:pointer;
    color:#2a1712;
  }
  .chat-input-row button:disabled{ opacity:0.5; cursor:not-allowed; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:rgba(241,237,228,0.2); border-radius:8px; }

  @media (max-width: 760px){
    .app{ flex-direction:column; padding:10px 16px 100px; }
    .sidebar{ width:100%; }
    .note-list{ flex-direction:row; overflow-x:auto; overflow-y:visible; }
    .note-card{ min-width:200px; }
    header{ padding:20px 16px 6px; }
    .chat-panel{ right:12px; left:12px; width:auto; }
  }
</style>
</head>
<body>

<header>
  <h1>The <span>Board</span></h1>
  <p>pin your notes — tap the chalk orb to talk them through</p>
</header>

<div class="app">
  <div class="sidebar">
    <button class="new-note-btn" id="newNoteBtn">+ new note</button>
    <div class="note-list" id="noteList"></div>
  </div>

  <div class="page-wrap">
    <div id="pageArea"></div>
  </div>
</div>

<button class="chat-toggle" id="chatToggle" aria-label="Chat about your notes">
  <svg viewBox="0 0 24 24" fill="none" stroke="#f1ede4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
  </svg>
</button>

<div class="chat-panel" id="chatPanel" style="display:none;">
  <div class="chat-header">
    <h2>Ask the Board</h2>
    <button id="chatClose">✕</button>
  </div>
  <div class="chat-messages" id="chatMessages">
    <div class="msg system-note">I can only see what's pinned to the board. Ask me about your notes.</div>
  </div>
  <div class="chat-input-row">
    <input type="text" id="chatInput" placeholder="Ask about your notes..." />
    <button id="chatSend">Ask</button>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = "notes";
  let notes = [];
  let activeId = null;
  let saveTimer = null;
  let chatHistory = [];
  let chatBusy = false;

  const noteList = document.getElementById('noteList');
  const pageArea = document.getElementById('pageArea');
  const newNoteBtn = document.getElementById('newNoteBtn');
  const chatToggle = document.getElementById('chatToggle');
  const chatPanel = document.getElementById('chatPanel');
  const chatClose = document.getElementById('chatClose');
  const chatMessages = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');
  const chatSend = document.getElementById('chatSend');

  function uid(){ return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function fmtTime(ts){
    const d = new Date(ts);
    return d.toLocaleDateString(undefined,{month:'short', day:'numeric'}) + ' · ' + d.toLocaleTimeString(undefined,{hour:'2-digit', minute:'2-digit'});
  }

  async function loadNotes(){
    noteList.innerHTML = '<div class="empty-hint">loading notes…</div>';
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      notes = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      notes = [];
    }
    if(notes.length){
      activeId = notes[0].id;
    }
    renderAll();
  }

  async function persistNotes(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(notes), false);
      setSaveStatus('saved ' + new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}));
    }catch(e){
      setSaveStatus('save failed — try again');
    }
  }

  function scheduleSave(){
    setSaveStatus('saving…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persistNotes, 500);
  }

  function setSaveStatus(text){
    const el = document.getElementById('saveStatus');
    if(el) el.textContent = text;
  }

  function renderAll(){
    renderList();
    renderPage();
  }

  function renderList(){
    noteList.innerHTML = '';
    if(!notes.length){
      noteList.innerHTML = '<div class="empty-hint">nothing pinned yet.<br>start a new note.</div>';
      return;
    }
    const sorted = [...notes].sort((a,b)=> b.updatedAt - a.updatedAt);
    sorted.forEach(note=>{
      const card = document.createElement('div');
      card.className = 'note-card' + (note.id === activeId ? ' active' : '');
      const preview = (note.content || '').trim().slice(0,140) || 'empty note';
      card.innerHTML = `
        <div class="pin"></div>
        <h3>${escapeHtml(note.title || 'Untitled')}</h3>
        <p>${escapeHtml(preview)}</p>
        <time>${fmtTime(note.updatedAt)}</time>
      `;
      card.addEventListener('click', ()=>{ activeId = note.id; renderAll(); });
      noteList.appendChild(card);
    });
  }

  function renderPage(){
    const note = notes.find(n=>n.id === activeId);
    if(!note){
      pageArea.innerHTML = '<div class="page"><div class="no-note">Pin a new note to start writing.</div></div>';
      return;
    }
    pageArea.innerHTML = `
      <div class="page">
        <div class="clip"></div>
        <input class="title-input" id="titleInput" placeholder="Untitled" value="${escapeAttr(note.title)}" />
        <div class="meta-row">
          <span>last touched ${fmtTime(note.updatedAt)}</span>
          <span id="saveStatus">saved</span>
        </div>
        <textarea class="content-textarea" id="contentInput" placeholder="Write whatever's on your mind...">${escapeHtml(note.content)}</textarea>
        <div class="actions-row">
          <span></span>
          <button class="delete-btn" id="deleteBtn">unpin &amp; delete</button>
        </div>
      </div>
    `;
    document.getElementById('titleInput').addEventListener('input', (e)=>{
      note.title = e.target.value;
      note.updatedAt = Date.now();
      scheduleSave();
      renderList();
    });
    document.getElementById('contentInput').addEventListener('input', (e)=>{
      note.content = e.target.value;
      note.updatedAt = Date.now();
      scheduleSave();
    });
    document.getElementById('deleteBtn').addEventListener('click', ()=>{
      notes = notes.filter(n=>n.id !== note.id);
      activeId = notes.length ? notes[0].id : null;
      persistNotes();
      renderAll();
    });
  }

  function escapeHtml(str){
    return (str || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }
  function escapeAttr(str){ return escapeHtml(str); }

  newNoteBtn.addEventListener('click', ()=>{
    const note = { id: uid(), title:'', content:'', updatedAt: Date.now() };
    notes.push(note);
    activeId = note.id;
    persistNotes();
    renderAll();
    setTimeout(()=>{ const t = document.getElementById('titleInput'); if(t) t.focus(); }, 30);
  });

  /* ---------------- RAG retrieval ---------------- */
  const STOPWORDS = new Set("a an the is are was were be been being to of in on for with and or but if then so as at by from this that these those i you he she it we they my your his her its our their what when where why how do does did not no yes can could should would will just about".split(' '));

  function tokenize(text){
    return (text.toLowerCase().match(/[a-z0-9']+/g) || []).filter(w => w.length > 2 && !STOPWORDS.has(w));
  }

  function chunkNotes(){
    const chunks = [];
    notes.forEach(note=>{
      const paras = (note.content || '').split(/\n{1,}/).map(p=>p.trim()).filter(Boolean);
      const title = note.title || 'Untitled';
      if(paras.length === 0 && note.title){
        chunks.push({ noteId: note.id, title, text: title, updatedAt: note.updatedAt });
      }
      paras.forEach(p=>{
        chunks.push({ noteId: note.id, title, text: p, updatedAt: note.updatedAt });
      });
    });
    return chunks;
  }

  function getRelevantChunks(query, topN){
    const chunks = chunkNotes();
    if(chunks.length === 0) return [];
    const qTokens = new Set(tokenize(query));
    const scored = chunks.map(c=>{
      const cTokens = tokenize(c.text + ' ' + c.title);
      let score = 0;
      cTokens.forEach(t=>{ if(qTokens.has(t)) score += (tokenize(c.title).includes(t) ? 2 : 1); });
      return { ...c, score };
    });
    scored.sort((a,b)=> b.score - a.score || b.updatedAt - a.updatedAt);
    let top = scored.filter(c=>c.score > 0).slice(0, topN);
    if(top.length === 0){
      top = scored.sort((a,b)=> b.updatedAt - a.updatedAt).slice(0, Math.min(topN, 3));
    }
    return top;
  }

  function buildContext(chunks){
    if(!chunks.length) return '(no notes pinned to the board yet)';
    const byTitle = {};
    chunks.forEach(c=>{
      byTitle[c.title] = byTitle[c.title] || [];
      byTitle[c.title].push(c.text);
    });
    return Object.entries(byTitle).map(([title, texts])=>
      `### ${title}\n${texts.join('\n')}`
    ).join('\n\n');
  }

  /* ---------------- Chat UI ---------------- */
  chatToggle.addEventListener('click', ()=>{
    chatPanel.style.display = chatPanel.style.display === 'none' ? 'flex' : 'none';
    if(chatPanel.style.display === 'flex') chatInput.focus();
  });
  chatClose.addEventListener('click', ()=> chatPanel.style.display = 'none');

  function addMessage(role, text){
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return div;
  }

  function addTyping(){
    const div = document.createElement('div');
    div.className = 'msg assistant typing-dots';
    div.innerHTML = '<span></span><span></span><span></span>';
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return div;
  }

  async function sendChat(){
    const text = chatInput.value.trim();
    if(!text || chatBusy) return;
    chatInput.value = '';
    addMessage('user', text);
    chatHistory.push({role:'user', content: text});
    chatBusy = true;
    chatSend.disabled = true;
    const typingEl = addTyping();

    const chunks = getRelevantChunks(text, 6);
    const context = buildContext(chunks);
    const systemPrompt = `You are a thoughtful assistant helping someone think through notes they've written themselves, pinned to "The Board". Answer ONLY using the NOTES CONTEXT below. If the notes don't contain enough to answer, say so plainly instead of guessing or inventing details. Be warm but concise — a few sentences, not an essay. When useful, mention which note(s) the answer draws from by title.\n\nNOTES CONTEXT:\n${context}`;

    try{
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: systemPrompt,
          messages: chatHistory.slice(-10)
        })
      });
      const data = await response.json();
      typingEl.remove();
      let answer = '';
      if(data && data.content){
        answer = data.content.map(b=> b.type === 'text' ? b.text : '').join('\n').trim();
      }
      if(!answer) answer = "I couldn't quite work that out — could you rephrase, or pin a bit more detail first?";
      addMessage('assistant', answer);
      chatHistory.push({role:'assistant', content: answer});
    }catch(e){
      typingEl.remove();
      addMessage('assistant', "Something went wrong reaching the board's memory. Try again in a moment.");
    }finally{
      chatBusy = false;
      chatSend.disabled = false;
    }
  }

  chatSend.addEventListener('click', sendChat);
  chatInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') sendChat(); });

  loadNotes();
})();
</script>
</body>
</html>
